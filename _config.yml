# _config.yml - Jekyll Documentation Site Configuration
title: " MASTER"
description: "Enterprise technical documentation platform with interactive navigation tree, multi-language snippets, and zero-dependency static deployment."
author: "DC Engineering"
url: "https://ThierryLab.github.io"
baseurl: "/test001"
github_url: "https://github.com/ThierryLab/test001"

# Branding (leave brand_tag empty to hide the badge next to the title)
brand_icon: "TPF"
brand_tag: "Labs"

# Classifications: top-level sections shown in the header nav. Each guide picks one with
# `classification:` in its front matter (guides without it use the default set below).
# This list controls the order; classifications not listed are appended automatically.
classifications:
  - "Docs"
  - "API"
  - "Deploy"

# Extra header links shown after the classifications (optional; full URLs are used as-is)
nav_links: []

# Footer Configuration (set show_footer to false to completely hide the footer)
show_footer: true
footer_text: "© 2026 THE DOC MASTER. All rights reserved."
footer_links:
  - title: "Home"
    url: "/"
  - title: "Documentation"
    url: "/docs/introduction/"
  - title: "GitHub"
    url: "https://github.com/ThierryLab/test001"

# Build Settings
# Full rebuilds keep the header/sidebar in sync on every page.
incremental: false
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections for Technical Guides
collections:
  docs:
    output: true
    permalink: /docs/:slug/

defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "guide"
      classification: "Docs"

# Exclude unnecessary build files and ruby vendor folders
exclude:
  - vendor
  - vendor/bundle
  - .bundle
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile.lock
  - .github
  - dist
