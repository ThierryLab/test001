# _config.yml - Jekyll Documentation Site Configuration
title: "THE DOC MASTER"
description: "Enterprise technical documentation platform with interactive navigation tree, multi-language snippets, and zero-dependency static deployment."
author: "DocuCraft Engineering"
url: "https://ThierryLab.github.io"
baseurl: "/test001"

# Footer Configuration (set show_footer to false to completely hide the footer)
show_footer: true
footer_text: "© 2026 THE DOC MASTER. All rights reserved. Built with modern documentation standards."
footer_links:
  - title: "Home"
    url: "/"
  - title: "Documentation"
    url: "/docs/introduction/"
  - title: "GitHub"
    url: "https://ThierryLab.github.io"

# Build Settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections for Technical Guides
collections:
  docs:
    output: true
    permalink: /docs/:slug/

# Exclude unnecessary build files and ruby vendor folders
exclude:
  - vendor
  - vendor/bundle
  - .bundle
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile.lock
  - .github
  - dist
