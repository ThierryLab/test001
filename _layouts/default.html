<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; min-height: 100vh; background: #fafafa; color: #0f172a; }
    .sidebar { width: 280px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; box-sizing: border-box; }
    .sidebar h2 { font-size: 11px; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; margin: 20px 0 8px 0; }
    .sidebar a { display: block; padding: 6px 10px; font-size: 13px; color: #334155; text-decoration: none; border-radius: 6px; }
    .sidebar a:hover { background: #f1f5f9; color: #2563eb; }
    .main { flex: 1; padding: 40px; max-width: 820px; box-sizing: border-box; margin: 0 auto; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 24px; margin-bottom: 24px; }
    pre { background: #0f172a; color: #f8fafc; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; position: static; } }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div style="font-weight: 700; font-size: 16px; margin-bottom: 20px;"><a href="{{ '/' | relative_url }}" style="color: #0f172a; text-decoration: none;">{{ site.title }}</a></div>
    <h2>Guides</h2>
    {% for doc in site.docs %}
      <a href="{{ doc.url | relative_url }}">{{ doc.title }}</a>
    {% endfor %}
    <h2>Cookbook Recipes</h2>
    {% for recipe in site.recipes %}
      <a href="{{ recipe.url | relative_url }}">{{ recipe.title }}</a>
    {% endfor %}
  </nav>
  <main class="main">
    {{ content }}
  </main>
</body>
</html>
